<!doctype html>
<!-- Link-preview banner source: the home hero (smoke, headline, roles) as a still. Regenerate the JPEG with ./build.sh,
     which also supplies smokeShader.js from src/components/Smoke/smokeShader.ts so the smoke always matches the site. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";font-weight:300;src:url(fonts/geist-latin-300-normal.woff) format("woff")}
@font-face{font-family:"Geist Mono";font-weight:400;src:url(fonts/geist-mono-latin-400-normal.woff) format("woff")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#010c15}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
  font-kerning:normal;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased}
/* The hero's smoke is 1.35 screens tall and the first screen shows its top 74%, so the banner frames it the same way. */
canvas{position:absolute;top:0;left:0;width:1200px;height:851px}
.text{position:absolute;left:84px;right:84px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;color:#eaf5f2}
h1{font:300 118px/.95 "Geist";letter-spacing:-.03em}
.star{display:inline-block;width:.26em;height:.26em;margin-left:.05em}
.star svg{display:block;width:100%;height:100%}
p{margin-top:30px;color:rgba(234,245,242,.68);font:400 19px/1.5 "Geist Mono";letter-spacing:.06em}
p span{margin:0 .7em;opacity:.6}
</style></head>
<body><div class="card">
<canvas id="smoke"></canvas>
<div class="text">
  <h1>Hi, I'm Ekram<span class="star"><svg viewBox="0 0 16 16"><path d="M8 0c.35 4.45 3.55 7.65 8 8-4.45.35-7.65 3.55-8 8-.35-4.45-3.55-7.65-8-8C4.45 7.65 7.65 4.45 8 0Z" fill="currentColor"/></svg></span></h1>
  <p>Software Developer<span>·</span>Data Scientist<span>·</span>Entrepreneur</p>
</div>
</div>
<script src="smokeShader.js"></script>
<script>
// Same frame the site rests on when motion is reduced (STILL_TIME in SmokeCanvas.tsx).
const STILL_TIME = 40;
const canvas = document.getElementById("smoke");
const scale = window.devicePixelRatio || 1;
canvas.width = 1200 * scale; canvas.height = 851 * scale;
const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
const compile = (type, source) => { const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s); return s; };
const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, SMOKE_VERTEX));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, SMOKE_FRAGMENT));
gl.linkProgram(program); gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, "aPosition");
gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.viewport(0, 0, canvas.width, canvas.height);
gl.uniform2f(gl.getUniformLocation(program, "uResolution"), canvas.width, canvas.height);
gl.uniform1f(gl.getUniformLocation(program, "uTime"), STILL_TIME);
gl.uniform2f(gl.getUniformLocation(program, "uPointer"), 0.5, 0.5);
gl.uniform1f(gl.getUniformLocation(program, "uStir"), 0);
gl.uniform3f(gl.getUniformLocation(program, "uPaper"), 245 / 255, 243 / 255, 238 / 255);
gl.drawArrays(gl.TRIANGLES, 0, 3);
</script></body></html>
