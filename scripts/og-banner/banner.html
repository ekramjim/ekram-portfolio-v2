<!doctype html>
<!-- Link-preview banner source. Regenerate the JPEG with ./build.sh (see that file). -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";font-weight:300;src:url(fonts/geist-latin-300-normal.woff) format("woff")}
@font-face{font-family:"Geist";font-weight:400;src:url(fonts/geist-latin-400-normal.woff) format("woff")}
@font-face{font-family:"Geist";font-weight:500;src:url(fonts/geist-latin-500-normal.woff) format("woff")}
@font-face{font-family:"Geist";font-weight:600;src:url(fonts/geist-latin-600-normal.woff) format("woff")}
@font-face{font-family:"Geist Mono";font-weight:400;src:url(fonts/geist-mono-latin-400-normal.woff) format("woff")}
@font-face{font-family:"Geist Mono";font-weight:500;src:url(fonts/geist-mono-latin-500-normal.woff) format("woff")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#010204}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
  font-kerning:normal;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 1000px 760px at 50% 50%,#04070c 0%,#03060a 60%,#010204 100%);}
svg.stars{position:absolute;inset:0}
.text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.line{font:400 68px/1.16 "Geist";letter-spacing:-.032em;color:#cfe3f7}
</style></head>
<body><div class="card">
<svg class="stars" id="stars" width="1200" height="630" viewBox="0 0 1200 630"></svg>
<div class="text"><div class="line">Infusing design with code<br>to make the best outcome.</div></div>
</div>
<script>
const P=["#74b4ee","#a8d8ff","#e6f2ff","#ffe4cb","#d99861"];
let seed=76129;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return(seed>>>0)/4294967296};
const svg=document.getElementById("stars"),NS="http://www.w3.org/2000/svg";
const defs=document.createElementNS(NS,"defs");
P.forEach((c,i)=>{defs.insertAdjacentHTML("beforeend",`<radialGradient id="h${i}"><stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset=".35" stop-color="${c}" stop-opacity=".12"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`)});
svg.appendChild(defs);
const add=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e)};
let n=0;
while(n<420){
  const x=rnd()*1200,y=rnd()*630;
  if(x>230&&x<970&&y>205&&y<425&&rnd()>.1)continue;
  n++;
  const big=rnd()<.04,dim=rnd()<.58;
  const r=big?1.4+rnd()*1.3:dim?.45+rnd()*.5:.7+rnd()*.7;
  const o=(big?.85:dim?.14+rnd()*.22:.32+rnd()*.42);
  const c=rnd()<.55?1:rnd()<.6?2:rnd()<.5?0:rnd()<.6?3:4;
  if(big)add("circle",{cx:x,cy:y,r:r*5,fill:`url(#h${c})`,opacity:o});
  add("circle",{cx:x,cy:y,r,fill:P[c],opacity:o});
}
</script></body></html>
